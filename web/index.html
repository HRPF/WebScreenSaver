<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>屏保配置</title>
    <link rel="stylesheet" href="main-config.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1>
                    <span class="logo-icon">&#9670;</span>
                    屏保配置
                    <span class="count-badge" id="count-badge">0</span>
                </h1>
                <div class="subtitle">选择并自定义你的屏幕保护</div>
            </div>
            <div id="screensaver-list" class="screensaver-list"></div>
        </aside>
        <main class="main-area">
            <div class="preview-container">
                <div class="preview-placeholder" id="preview-placeholder">
                    <div class="placeholder-icon">&#9670;</div>
                    <p>请从左侧选择一个屏保</p>
                </div>
                <div class="preview-frame-wrapper">
                    <iframe id="preview-frame" frameborder="0"></iframe>
                </div>
            </div>
            <div class="action-bar">
                <div class="action-info" id="action-info"></div>
                <div class="action-buttons">
                    <button id="btn-configure" disabled>样式设置</button>
                    <button id="btn-apply" disabled>启用屏保</button>
                </div>
            </div>
        </main>
    </div>
    <script src="main-config.js"></script>
</body>
</html>
